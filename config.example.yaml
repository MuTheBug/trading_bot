# Binance USDT-M Futures Trading Bot - strategy & risk configuration
# The installer copies this to config.yaml on first run.

# --- Symbols to trade (low-notional alts for a $10 account) ---
symbols:
  - DOGEUSDT
  - 1000PEPEUSDT
  - XRPUSDT
  - SUIUSDT
  - 1000SHIBUSDT

# --- Timeframes ---
timeframe: 15m            # signal timeframe
htf_timeframe: 1h         # higher-timeframe trend filter

# --- Leverage & margin ---
leverage: 3               # 3x isolated (balanced profile)
margin_type: ISOLATED     # ISOLATED | CROSSED

# --- Risk management ---
risk:
  risk_per_trade_pct: 1.0         # % of equity risked per trade
  max_concurrent_positions: 2     # max simultaneous open positions
  daily_loss_limit_pct: 2.0       # halt entries for the day if daily PnL <= -X%
  max_drawdown_pct: 10.0          # halt entries until manual resume if DD >= X%
  funding_rate_skip_pct: 15.0     # skip entry if |annualized funding| > X%
  funding_rate_exit_pct: 20.0     # force-close on same side if |annualized funding| > X%
  time_stop_hours: 24             # force-close if no TP hit after X hours
  cooldown_after_loss_minutes: 15 # no entries on same symbol for X min after a loss

# --- Strategy parameters (trend-momentum hybrid) ---
strategy:
  name: trend_momentum
  ema_fast: 9
  ema_slow: 21
  ema_htf: 50
  adx_period: 14
  adx_threshold: 20
  rsi_period: 14
  rsi_long_min: 40
  rsi_long_max: 70
  rsi_short_min: 30
  rsi_short_max: 60
  atr_period: 14
  volume_sma_period: 20

# --- Exit ladder (multiples of ATR) ---
exits:
  sl_atr_mult: 1.5            # initial stop loss distance
  tp1_atr_mult: 0.75          # first take-profit
  tp1_close_pct: 40           # % of position closed at TP1
  tp2_atr_mult: 2.0           # second take-profit
  tp2_close_pct: 30           # % of position closed at TP2
  tp3_atr_mult: 4.0           # final take-profit
  trail_atr_mult: 1.5         # trailing stop distance after TP2
  move_sl_to_be_after_tp1: true

# --- Simulator (paper trading) ---
simulator:
  starting_balance: 10.0       # USDT
  taker_fee_pct: 0.04          # Binance Futures taker fee
  maker_fee_pct: 0.02
  slippage_ticks: 1            # assume 1 tick slippage on market orders

# --- Bot loop ---
loop_interval_seconds: 15      # how often to check for signals / manage positions
kline_history: 200             # candles fetched per symbol

# --- Logging ---
log_level: INFO                # DEBUG | INFO | WARNING | ERROR
log_file: logs/bot.log
state_file: state/bot_state.json

# --- Telegram ---
telegram:
  enabled: true
  alerts_on_entry: true
  alerts_on_exit: true
  alerts_on_error: true
  daily_summary_utc_hour: 0    # post daily summary at this UTC hour

# --- AI brain (MiniMax M2.7 via Anthropic-compatible API) ---
# The AI makes the full trading decision: side, entry, SL, TP ladder, leverage.
# Risk manager still enforces sizing, daily loss, drawdown and cooldowns as a
# hard safety net — the AI cannot bypass them.
ai:
  enabled: true                # set false to fall back to the classical strategy
  model: MiniMax-M2.7
  max_tokens: 2048
  thinking: false              # set true to use extended thinking (slower, more tokens)
  max_leverage: 5              # hard cap on leverage the AI may request
  min_confidence: 0.6          # skip trades where AI confidence is below this
  kline_history: 80            # 15m candles fed to the model per call
  htf_history: 40              # 1h candles fed to the model per call
  request_timeout_s: 60
  retries: 2
